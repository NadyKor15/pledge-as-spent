# On every push to main and on pull requests: the types, every unit and integration test, then the README's claims
# (npm run judge). No secrets and no deploy: the hosted demo is deployed by hand, never from here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The receipt generator's test renders a receipt in Chromium (tests/receipts/generator.test.ts).
      - name: Chromium for the receipt renderer
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Unit and integration tests
        run: npx vitest run --testTimeout=30000 --hookTimeout=30000
      - name: The README's claims
        run: npm run judge
